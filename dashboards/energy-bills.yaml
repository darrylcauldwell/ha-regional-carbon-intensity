# Octopus Monthly Insight Dashboard
#
# Lovelace dashboard for monthly electricity billing analysis using the
# tariff_comparison sensor from the custom ha-octopus-energy integration.
#
# Entity IDs use ACCOUNT_tariff_comparison placeholder which is replaced
# by scripts/deploy_energy_bills.py at deploy time.
#
# Cards:
#   1. Last Month Tariff Ranking — was I on the cheapest tariff?
#   2. Cost Breakdown — standing charge vs energy usage per month
#   3. Monthly Electricity Costs — per-month cost table with colour coding
#   4. Month-on-Month Change — delta vs previous month
#   5. Tariff Savings by Month — current vs cheapest alternative
#   6. Period Summary — headline stats across all months
#
# NOTE: Only electricity import data is available historically via tariff
# comparison. Export revenue and gas costs have no monthly history source.

views:
  - title: Octopus Monthly Insight
    path: energy-bills
    icon: mdi:receipt-text
    cards:
      # ── Card 1: Last Month Tariff Ranking ────────────────────────────────
      - type: markdown
        title: Was I On The Cheapest Tariff?
        content: |
          {%- set tc = state_attr('sensor.octopus_energy_ACCOUNT_tariff_comparison', 'tariffs') -%}
          {%- if tc -%}
          {%- set ns = namespace(current=none, last_idx=-1) -%}
          {%- for t in tc -%}
          {%- if t.is_current -%}{%- set ns.current = t -%}{%- endif -%}
          {%- endfor -%}
          {%- if ns.current and ns.current.months | length > 1 -%}
          {%- set ns.last_idx = ns.current.months | length - 2 -%}
          {%- set last_month = ns.current.months[ns.last_idx] -%}
          {%- set ns2 = namespace(tariffs=[], cheapest_cost=999, cheapest_name='', current_cost=0) -%}
          {%- for t in tc -%}
          {%- if t.months | length > ns.last_idx -%}
          {%- set m = t.months[ns.last_idx] -%}
          {%- if m.total_cost < ns2.cheapest_cost -%}
          {%- set ns2.cheapest_cost = m.total_cost -%}
          {%- set ns2.cheapest_name = t.display_name -%}
          {%- endif -%}
          {%- if t.is_current -%}{%- set ns2.current_cost = m.total_cost -%}{%- endif -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set saving = ns2.current_cost - ns2.cheapest_cost -%}
          {%- set on_cheapest = saving <= 0.01 %}
          ### {{ last_month.month }}
          {%- if on_cheapest %}

          <font color="green">**Yes — you were on the cheapest tariff!**</font>
          {%- else %}

          <font color="red">**No — you could have saved £{{ '%.2f' | format(saving) }}**</font> on **{{ ns2.cheapest_name }}**
          {%- endif %}

          | Tariff | Cost | vs You |
          |--------|----:|----:|
          {%- for t in tc -%}
          {%- if t.months | length > ns.last_idx -%}
          {%- set m = t.months[ns.last_idx] -%}
          {%- set diff = m.total_cost - ns2.current_cost -%}
          {%- if t.is_current %}
          | **{{ t.display_name }}** ★ | **£{{ '%.2f' | format(m.total_cost) }}** | — |
          {%- elif diff > 0 %}
          | {{ t.display_name }} | £{{ '%.2f' | format(m.total_cost) }} | <font color="green">+£{{ '%.2f' | format(diff) }}</font> |
          {%- elif diff < 0 %}
          | {{ t.display_name }} | £{{ '%.2f' | format(m.total_cost) }} | <font color="red">{{ '%.2f' | format(diff) }}</font> |
          {%- else %}
          | {{ t.display_name }} | £{{ '%.2f' | format(m.total_cost) }} | £0.00 |
          {%- endif -%}
          {%- endif -%}
          {%- endfor %}

          *Based on {{ last_month.days_with_data }} days of data ({{ last_month.consumption_kwh | round(0) | int }} kWh consumed)*
          {%- elif ns.current and ns.current.months | length == 1 %}
          *Only one month of data available — need at least two months for last-month comparison.*
          {%- else %}
          *No monthly data available yet.*
          {%- endif -%}
          {%- else %}
          *Tariff comparison data not available.*
          {%- endif %}

      # ── Card 2: Cost Breakdown — Standing vs Energy ──────────────────────
      - type: markdown
        title: Cost Breakdown — Standing vs Energy
        content: |
          {%- set tc = state_attr('sensor.octopus_energy_ACCOUNT_tariff_comparison', 'tariffs') -%}
          {%- if tc -%}
          {%- set ns = namespace(current=none) -%}
          {%- for t in tc -%}
          {%- if t.is_current -%}{%- set ns.current = t -%}{%- endif -%}
          {%- endfor -%}
          {%- if ns.current and ns.current.months | length > 0 -%}
          {%- set months = ns.current.months -%}
          {%- set ns2 = namespace(max_total=0) -%}
          {%- for m in months -%}
          {%- if m.total_cost > ns2.max_total %}{% set ns2.max_total = m.total_cost %}{% endif -%}
          {%- endfor -%}
          {%- set bar_width = 20 %}

          | Month | Standing | Energy | Total | |
          |-------|----:|----:|----:|-----|
          {%- for m in months -%}
          {%- set standing_pct = (m.standing_cost / m.total_cost * 100) if m.total_cost > 0 else 0 -%}
          {%- set energy_pct = (m.unit_cost / m.total_cost * 100) if m.total_cost > 0 else 0 -%}
          {%- set total_scale = m.total_cost / ns2.max_total if ns2.max_total > 0 else 0 -%}
          {%- set standing_blocks = (standing_pct / 100 * bar_width * total_scale) | round(0) | int -%}
          {%- set energy_blocks = (energy_pct / 100 * bar_width * total_scale) | round(0) | int -%}
          {%- if standing_blocks == 0 and m.standing_cost > 0 %}{% set standing_blocks = 1 %}{% endif -%}
          {%- if energy_blocks == 0 and m.unit_cost > 0 %}{% set energy_blocks = 1 %}{% endif %}
          | {{ m.month }} | £{{ '%.2f' | format(m.standing_cost) }} ({{ standing_pct | round(0) | int }}%) | £{{ '%.2f' | format(m.unit_cost) }} ({{ energy_pct | round(0) | int }}%) | £{{ '%.2f' | format(m.total_cost) }} | <font color="orange">{{ '█' * standing_blocks }}</font><font color="dodgerblue">{{ '█' * energy_blocks }}</font> |
          {%- endfor %}

          <font color="orange">█</font> Standing charge  <font color="dodgerblue">█</font> Energy usage
          {%- else %}
          *No monthly data available yet.*
          {%- endif -%}
          {%- else %}
          *Tariff comparison data not available.*
          {%- endif %}

      # ── Card 3: Monthly Electricity Costs ──────────────────────────────
      - type: markdown
        title: Monthly Electricity Costs
        content: |
          {%- set tc = state_attr('sensor.octopus_energy_ACCOUNT_tariff_comparison', 'tariffs') -%}
          {%- if tc -%}
          {%- set ns = namespace(current=none) -%}
          {%- for t in tc -%}
          {%- if t.is_current -%}{%- set ns.current = t -%}{%- endif -%}
          {%- endfor -%}
          {%- if ns.current and ns.current.months | length > 0 -%}
          {%- set months = ns.current.months -%}
          {%- set ns2 = namespace(min_total=999, max_total=0, sum_kwh=0, sum_cost=0, total_days=0) -%}
          {%- for m in months -%}
          {%- if m.total_cost < ns2.min_total %}{% set ns2.min_total = m.total_cost %}{% endif -%}
          {%- if m.total_cost > ns2.max_total %}{% set ns2.max_total = m.total_cost %}{% endif -%}
          {%- set ns2.sum_kwh = ns2.sum_kwh + m.consumption_kwh -%}
          {%- set ns2.sum_cost = ns2.sum_cost + m.total_cost -%}
          {%- set ns2.total_days = ns2.total_days + m.days_with_data -%}
          {%- endfor -%}
          {%- set spread = ns2.max_total - ns2.min_total -%}
          {%- set green_thresh = ns2.min_total + spread * 0.33 -%}
          {%- set red_thresh = ns2.min_total + spread * 0.66 %}
          **{{ ns.current.display_name }}** (current tariff)

          | Month | Usage (kWh) | Energy Cost | Standing | Total | Daily Avg |
          |-------|----:|----:|----:|----:|----:|
          {%- for m in months %}
          {%- set daily_avg = m.total_cost / m.days_with_data if m.days_with_data > 0 else 0 -%}
          {%- set partial = m.days_with_data < m.days_in_month -%}
          {%- set month_label = m.month ~ ' (' ~ m.days_with_data ~ ' of ' ~ m.days_in_month ~ ' days)' if partial else m.month -%}
          {%- if partial and m == months[-1] -%}
          {%- set projected = daily_avg * m.days_in_month -%}
          {%- set month_label = m.month ~ ' (' ~ m.days_with_data ~ '/' ~ m.days_in_month ~ 'd)' -%}
          | {{ month_label }} | {{ '%.0f' | format(m.consumption_kwh) }} | £{{ '%.2f' | format(m.unit_cost) }} | £{{ '%.2f' | format(m.standing_cost) }} | {%- if m.total_cost <= green_thresh %} <font color="green">£{{ '%.2f' | format(m.total_cost) }}</font>{%- elif m.total_cost >= red_thresh %} <font color="red">£{{ '%.2f' | format(m.total_cost) }}</font>{%- else %} <font color="orange">£{{ '%.2f' | format(m.total_cost) }}</font>{%- endif %} | £{{ '%.2f' | format(daily_avg) }} |
          | *→ projected* | | | | *£{{ '%.2f' | format(projected) }}* | |
          {%- else %}
          | {{ month_label }} | {{ '%.0f' | format(m.consumption_kwh) }} | £{{ '%.2f' | format(m.unit_cost) }} | £{{ '%.2f' | format(m.standing_cost) }} | {%- if m.total_cost <= green_thresh %} <font color="green">£{{ '%.2f' | format(m.total_cost) }}</font>{%- elif m.total_cost >= red_thresh %} <font color="red">£{{ '%.2f' | format(m.total_cost) }}</font>{%- else %} <font color="orange">£{{ '%.2f' | format(m.total_cost) }}</font>{%- endif %} | £{{ '%.2f' | format(daily_avg) }} |
          {%- endif -%}
          {%- endfor %}
          | **Total** | **{{ '%.0f' | format(ns2.sum_kwh) }}** | | | **£{{ '%.2f' | format(ns2.sum_cost) }}** | **£{{ '%.2f' | format(ns2.sum_cost / ns2.total_days if ns2.total_days > 0 else 0) }}** |
          {%- else %}
          *No monthly data available yet.*
          {%- endif -%}
          {%- else %}
          *Tariff comparison data not available.*
          {%- endif %}

      # ── Card 4: Month-on-Month Change ──────────────────────────────────
      - type: markdown
        title: Month-on-Month Change
        content: |
          {%- set tc = state_attr('sensor.octopus_energy_ACCOUNT_tariff_comparison', 'tariffs') -%}
          {%- if tc -%}
          {%- set ns = namespace(current=none) -%}
          {%- for t in tc -%}
          {%- if t.is_current -%}{%- set ns.current = t -%}{%- endif -%}
          {%- endfor -%}
          {%- if ns.current and ns.current.months | length > 0 -%}
          {%- set months = ns.current.months %}

          | Month | kWh Change | Cost Change |
          |-------|----:|----:|
          {%- for m in months -%}
          {%- if loop.first %}
          | {{ m.month }} | — | — |
          {%- else -%}
          {%- set prev = months[loop.index0 - 1] -%}
          {%- set kwh_delta = m.consumption_kwh - prev.consumption_kwh -%}
          {%- set cost_delta = m.total_cost - prev.total_cost -%}
          {%- set kwh_sign = '+' if kwh_delta >= 0 else '' -%}
          {%- set cost_sign = '+' if cost_delta >= 0 else '' %}
          | {{ m.month }} | {%- if kwh_delta > 0 %} <font color="red">{{ kwh_sign }}{{ '%.0f' | format(kwh_delta) }}</font>{%- elif kwh_delta < 0 %} <font color="green">{{ kwh_sign }}{{ '%.0f' | format(kwh_delta) }}</font>{%- else %} 0{%- endif %} | {%- if cost_delta > 0 %} <font color="red">{{ cost_sign }}£{{ '%.2f' | format(cost_delta) }}</font>{%- elif cost_delta < 0 %} <font color="green">{{ cost_sign }}£{{ '%.2f' | format(cost_delta) }}</font>{%- else %} £0.00{%- endif %} |
          {%- endif -%}
          {%- endfor %}
          {%- else %}
          *No monthly data available yet.*
          {%- endif -%}
          {%- else %}
          *Tariff comparison data not available.*
          {%- endif %}

      # ── Card 5: Tariff Savings by Month ────────────────────────────────
      - type: markdown
        title: Tariff Savings by Month
        content: |
          {%- set tc = state_attr('sensor.octopus_energy_ACCOUNT_tariff_comparison', 'tariffs') -%}
          {%- if tc -%}
          {%- set ns = namespace(current=none, current_idx=0) -%}
          {%- for t in tc -%}
          {%- if t.is_current -%}{%- set ns.current = t -%}{%- set ns.current_idx = loop.index0 -%}{%- endif -%}
          {%- endfor -%}
          {%- if ns.current and ns.current.months | length > 0 -%}
          {%- set months = ns.current.months %}

          | Month | Current | Cheapest Alt | Saving | Best Tariff |
          |-------|----:|----:|----:|-----|
          {%- for m in months -%}
          {%- set current_cost = m.total_cost -%}
          {%- set ns2 = namespace(cheapest=999, cheapest_name='') -%}
          {%- for t in tc -%}
          {%- if not t.is_current and t.months | length > loop.parent.index0 -%}
          {%- set alt_cost = t.months[loop.parent.index0].total_cost -%}
          {%- if alt_cost < ns2.cheapest -%}
          {%- set ns2.cheapest = alt_cost -%}
          {%- set ns2.cheapest_name = t.display_name -%}
          {%- endif -%}
          {%- endif -%}
          {%- endfor -%}
          {%- if ns2.cheapest < 999 -%}
          {%- set saving = current_cost - ns2.cheapest %}
          | {{ m.month }} | £{{ '%.2f' | format(current_cost) }} | £{{ '%.2f' | format(ns2.cheapest) }} | {%- if saving > 0 %} <font color="red">+£{{ '%.2f' | format(saving) }}</font>{%- elif saving < 0 %} <font color="green">-£{{ '%.2f' | format(saving | abs) }}</font>{%- else %} £0.00{%- endif %} | {{ ns2.cheapest_name }} |
          {%- else %}
          | {{ m.month }} | £{{ '%.2f' | format(current_cost) }} | *n/a* | — | — |
          {%- endif -%}
          {%- endfor -%}
          {%- set ns3 = namespace(total_current=0, total_cheapest_sum=0) -%}
          {%- for m in months -%}
          {%- set ns3.total_current = ns3.total_current + m.total_cost -%}
          {%- set ns4 = namespace(cheapest=999) -%}
          {%- for t in tc -%}
          {%- if not t.is_current and t.months | length > loop.parent.index0 -%}
          {%- if t.months[loop.parent.index0].total_cost < ns4.cheapest -%}
          {%- set ns4.cheapest = t.months[loop.parent.index0].total_cost -%}
          {%- endif -%}
          {%- endif -%}
          {%- endfor -%}
          {%- if ns4.cheapest < 999 -%}
          {%- set ns3.total_cheapest_sum = ns3.total_cheapest_sum + ns4.cheapest -%}
          {%- else -%}
          {%- set ns3.total_cheapest_sum = ns3.total_cheapest_sum + m.total_cost -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set total_saving = ns3.total_current - ns3.total_cheapest_sum %}
          | **Total** | **£{{ '%.2f' | format(ns3.total_current) }}** | **£{{ '%.2f' | format(ns3.total_cheapest_sum) }}** | {%- if total_saving > 0 %} **<font color="red">+£{{ '%.2f' | format(total_saving) }}</font>**{%- elif total_saving < 0 %} **<font color="green">-£{{ '%.2f' | format(total_saving | abs) }}</font>**{%- else %} **£0.00**{%- endif %} | |
          {%- else %}
          *No monthly data available yet.*
          {%- endif -%}
          {%- else %}
          *Tariff comparison data not available.*
          {%- endif %}

      # ── Card 6: Period Summary ─────────────────────────────────────────
      - type: markdown
        title: Period Summary
        content: |
          {%- set tc = state_attr('sensor.octopus_energy_ACCOUNT_tariff_comparison', 'tariffs') -%}
          {%- set total_kwh = state_attr('sensor.octopus_energy_ACCOUNT_tariff_comparison', 'total_consumption_kwh') -%}
          {%- set region = state_attr('sensor.octopus_energy_ACCOUNT_tariff_comparison', 'gsp_region') -%}
          {%- set updated = state_attr('sensor.octopus_energy_ACCOUNT_tariff_comparison', 'updated_at') -%}
          {%- if tc -%}
          {%- set ns = namespace(current=none) -%}
          {%- for t in tc -%}
          {%- if t.is_current -%}{%- set ns.current = t -%}{%- endif -%}
          {%- endfor -%}
          {%- if ns.current and ns.current.months | length > 0 -%}
          {%- set months = ns.current.months -%}
          {%- set ns2 = namespace(sum_cost=0, min_cost=999, min_month='', max_cost=0, max_month='', total_days=0) -%}
          {%- for m in months -%}
          {%- set ns2.sum_cost = ns2.sum_cost + m.total_cost -%}
          {%- set ns2.total_days = ns2.total_days + m.days_with_data -%}
          {%- if m.total_cost < ns2.min_cost -%}{%- set ns2.min_cost = m.total_cost -%}{%- set ns2.min_month = m.month -%}{%- endif -%}
          {%- if m.total_cost > ns2.max_cost -%}{%- set ns2.max_cost = m.total_cost -%}{%- set ns2.max_month = m.month -%}{%- endif -%}
          {%- endfor -%}
          {%- set avg_monthly = ns2.sum_cost / (months | length) -%}
          {%- set daily_avg = ns2.sum_cost / ns2.total_days if ns2.total_days > 0 else 0 %}

          | | |
          |---|---:|
          | **Period** | {{ months[0].month }} to {{ months[-1].month }} ({{ months | length }} months) |
          | **Total consumption** | {{ '%.0f' | format(total_kwh) }} kWh |
          | **Total cost** | £{{ '%.2f' | format(ns2.sum_cost) }} |
          | **Average monthly cost** | £{{ '%.2f' | format(avg_monthly) }} |
          | **Average daily cost** | £{{ '%.2f' | format(daily_avg) }} |
          | **Cheapest month** | {{ ns2.min_month }} (£{{ '%.2f' | format(ns2.min_cost) }}) |
          | **Most expensive month** | {{ ns2.max_month }} (£{{ '%.2f' | format(ns2.max_cost) }}) |
          | **GSP region** | {{ region }} |
          | **Last updated** | {{ updated }} |

          *Note: This dashboard covers electricity import only. Export revenue and gas costs
          are not available historically via tariff comparison data.*
          {%- else %}
          *No monthly data available yet.*
          {%- endif -%}
          {%- else %}
          *Tariff comparison data not available.*
          {%- endif %}
